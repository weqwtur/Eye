<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hit the Eye</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background: #080810;
      overscroll-behavior: none;
      touch-action: none;
    }
    body {
      font-family: 'Courier New', monospace;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      touch-action: none !important;
      overscroll-behavior: none !important;
      background: #080810;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px 24px;
      pointer-events: none;
      z-index: 5;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      padding: 6px 12px;
      border-radius: 32px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
      line-height: 1;
    }
    .stat-label {
      font-size: 9px;
      color: #cccccc;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 2px;
    }
    #lives {
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      padding: 6px 16px;
      border-radius: 32px;
    }
    .life {
      font-size: 20px;
      transition: all 0.2s;
      filter: brightness(1.2);
    }
    .life.lost {
      opacity: 0.2;
      filter: grayscale(1);
    }
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(8, 8, 16, 0.96);
      backdrop-filter: blur(4px);
      z-index: 20;
      pointer-events: auto;
    }
    .screen.hidden {
      display: none;
    }
    .eye-symbol {
      font-size: 72px;
      margin-bottom: 8px;
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .screen-title {
      font-size: 13px;
      letter-spacing: 6px;
      color: #aaaaaa;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .screen-big {
      font-size: 38px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 3px;
      margin-bottom: 32px;
    }
    .screen-sub {
      font-size: 11px;
      color: #888888;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 48px;
      text-align: center;
      line-height: 1.8;
      max-width: 260px;
    }
    .btn {
      background: transparent;
      border: 1px solid #888888;
      color: #ffffff;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 14px 36px;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .btn:active {
      background: rgba(255, 255, 255, 0.1);
      border-color: #ffffff;
      color: #ffffff;
    }
    #combo-display {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 4px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255,255,255,0.5);
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
  </style>
</head>
<body>
<div id="game-container">
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div class="stat">
      <div class="stat-value" id="score-ui">0</div>
      <div class="stat-label">score</div>
    </div>
    <div id="lives">
      <span class="life" id="l1">👁</span>
      <span class="life" id="l2">👁</span>
      <span class="life" id="l3">👁</span>
    </div>
    <div class="stat">
      <div class="stat-value" id="level-ui">1</div>
      <div class="stat-label">level</div>
    </div>
  </div>
  <div id="combo-display" style="opacity:0"></div>
  <div class="screen" id="start-screen">
    <div class="eye-symbol">👁</div>
    <div class="screen-title">telegram mini app</div>
    <div class="screen-big">HIT THE EYE</div>
    <div class="screen-sub">hold to aim<br>release to fire<br>hit the pupil</div>
    <button class="btn" id="start-btn">[ focus ]</button>
  </div>
  <div class="screen hidden" id="over-screen">
    <div class="eye-symbol" style="animation:none; opacity:0.3">👁</div>
    <div class="screen-title">vision lost</div>
    <div id="score-display">0</div>
    <div id="score-label" style="color:#aaa;">SCORE</div>
    <div id="best-display" style="color:#aaa;">best — 0</div>
    <button class="btn" id="retry-btn">[ retry ]</button>
  </div>
</div>
<script>
  (function() {
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.disableVerticalSwipes();
      tg.setBackgroundColor("#080810");
      tg.setHeaderColor("#080810");
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let gameState = 'idle';
    let score = 0;
    let best = parseInt(localStorage.getItem('hte_best') || '0');
    let bestLevel = parseInt(localStorage.getItem('hte_best_level') || '1');
    let lives = 3;
    let level = 1;
    let combo = 0;

    let eye = { x: 0, y: 0, r: 52, pupilR: 18, vx: 0, vy: 0, phase: 0 };
    let launcher = { x: 0, y: 0 };
    let projectile = { x: 0, y: 0, vx: 0, vy: 0, active: false, trail: [] };
    let aim = { active: false, startX: 0, startY: 0, curX: 0, curY: 0, power: 0 };
    let particles = [];
    let hitFlash = 0;
    let missFlash = 0;
    let comboAnim = 0;

    function updateUI() {
      document.getElementById('score-ui').innerText = score;
      document.getElementById('level-ui').innerText = level;
    }

    function updateLives() {
      for (let i = 1; i <= 3; i++) {
        const lifeEl = document.getElementById(`l${i}`);
        if (lifeEl) lifeEl.classList.toggle('lost', i > lives);
      }
    }

    function showComboMessage() {
      const el = document.getElementById('combo-display');
      if (el) {
        el.innerText = `×${combo} COMBO`;
        el.style.opacity = '1';
        comboAnim = 100;
      }
    }

    function spawnEye() {
      const margin = 80;
      eye.r = Math.max(34, 52 - Math.floor(level * 1.4));
      eye.pupilR = Math.max(12, 18 - Math.floor(level * 0.9));
      eye.x = margin + Math.random() * (canvas.width - margin * 2);
      eye.y = 100 + Math.random() * (canvas.height * 0.42);
      const speed = 0.55 + level * 0.18;
      const angle = Math.random() * Math.PI * 2;
      eye.vx = Math.cos(angle) * speed;
      eye.vy = Math.sin(angle) * speed * 0.45;
      eye.phase = Math.random() * Math.PI * 2;
    }

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 5.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2.2,
          life: 65 + Math.random() * 45,
          r: 1.6 + Math.random() * 3.2,
          color
        });
      }
    }

    function onHit(zone) {
      projectile.active = false;
      projectile.trail = [];
      const isPupil = zone === 'pupil';
      const points = isPupil ? (10 + combo * 5) : 3;
      score += points;
      combo++;
      spawnParticles(eye.x, eye.y, isPupil ? '#ffffff' : '#aaaaaa', isPupil ? 26 : 12);
      hitFlash = isPupil ? 85 : 45;
      if (tg) tg.HapticFeedback.impactOccurred(isPupil ? 'heavy' : 'medium');
      if (combo >= 3) showComboMessage();
      level = 1 + Math.floor(score / 50);
      spawnEye();
      gameState = 'aiming';
      updateUI();
    }

    function onMiss() {
      projectile.active = false;
      projectile.trail = [];
      combo = 0;
      lives--;
      missFlash = 65;
      if (tg) tg.HapticFeedback.notificationOccurred('error');
      updateLives();
      if (lives <= 0) gameOver();
      else gameState = 'aiming';
    }

    function gameOver() {
      gameState = 'dead';
      if (score > best) {
        best = score;
        localStorage.setItem('hte_best', best);
      }
      if (level > bestLevel) {
        bestLevel = level;
        localStorage.setItem('hte_best_level', bestLevel);
      }
      document.getElementById('score-display').innerText = score;
      document.getElementById('best-display').innerText = `best — ${best}`;
      setTimeout(() => {
        document.getElementById('over-screen').classList.remove('hidden');
      }, 500);
      if (tg) {
        try { tg.sendData(JSON.stringify({ score, best, level, bestLevel })); } catch(e) {}
      }
    }

    function fire() {
      if (aim.power < 0.05) return;
      const dx = aim.startX - aim.curX;
      const dy = aim.startY - aim.curY;
      const len = Math.hypot(dx, dy) || 1;
      const speed = aim.power * 22;
      projectile.x = launcher.x;
      projectile.y = launcher.y;
      projectile.vx = (dx / len) * speed;
      projectile.vy = (dy / len) * speed;
      projectile.active = true;
      projectile.trail = [];
      gameState = 'flying';
      if (tg) tg.HapticFeedback.impactOccurred('light');
    }

    function updateGame() {
      if (gameState !== 'aiming' && gameState !== 'flying') return;
      eye.phase += 0.012;
      eye.x += eye.vx;
      eye.y += eye.vy + Math.sin(eye.phase) * 0.4;
      if (eye.x < eye.r) { eye.x = eye.r; eye.vx *= -0.98; }
      if (eye.x > canvas.width - eye.r) { eye.x = canvas.width - eye.r; eye.vx *= -0.98; }
      if (eye.y < eye.r + 60) { eye.y = eye.r + 60; eye.vy *= -0.98; }
      if (eye.y > canvas.height * 0.6) { eye.y = canvas.height * 0.6; eye.vy *= -0.98; }
      if (projectile.active) {
        projectile.trail.push({ x: projectile.x, y: projectile.y, age: 0 });
        if (projectile.trail.length > 20) projectile.trail.shift();
        projectile.trail.forEach(t => t.age++);
        projectile.vy += 0.18;
        projectile.x += projectile.vx;
        projectile.y += projectile.vy;
        const dx = projectile.x - eye.x;
        const dy = projectile.y - eye.y;
        const dist = Math.hypot(dx, dy);
        if (dist < eye.pupilR + 9) onHit('pupil');
        else if (dist < eye.r + 8) onHit('eye');
        else if (projectile.y > canvas.height + 50 || projectile.x < -50 || projectile.x > canvas.width + 50) onMiss();
      }
      particles = particles.filter(p => p.life > 0);
      for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.life -= 2;
        p.vx *= 0.97;
      }
      if (hitFlash > 0) hitFlash -= 3;
      if (missFlash > 0) missFlash -= 3;
      if (comboAnim > 0) {
        comboAnim -= 2;
        if (comboAnim <= 0) document.getElementById('combo-display').style.opacity = '0';
      }
    }

    function drawEye() {
      const { x, y, r, pupilR } = eye;
      const glow = ctx.createRadialGradient(x, y, r * 0.3, x, y, r * 2.2);
      glow.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
      glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.beginPath();
      ctx.arc(x, y, r * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 0.65, 0, 0, Math.PI * 2);
      const sclera = ctx.createRadialGradient(x - r * 0.2, y - r * 0.2, 0, x, y, r);
      sclera.addColorStop(0, '#1a1a24');
      sclera.addColorStop(1, '#0e0e18');
      ctx.fillStyle = sclera;
      ctx.fill();
      ctx.strokeStyle = '#666666';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
      const iris = ctx.createRadialGradient(x, y, 0, x, y, pupilR * 2.2);
      iris.addColorStop(0, '#dddddd');
      iris.addColorStop(0.5, '#aaaaaa');
      iris.addColorStop(1, '#888888');
      ctx.beginPath();
      ctx.arc(x, y, pupilR * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = iris;
      ctx.fill();
      ctx.save();
      ctx.globalAlpha = 0.3;
      for (let i = 0; i < 12; i++) {
        const ang = (i / 12) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(ang) * pupilR * 1.1, y + Math.sin(ang) * pupilR * 1.1);
        ctx.lineTo(x + Math.cos(ang) * pupilR * 2.1, y + Math.sin(ang) * pupilR * 2.1);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }
      ctx.restore();
      const pupilGrad = ctx.createRadialGradient(x - 2, y - 2, 0, x, y, pupilR);
      pupilGrad.addColorStop(0, '#111111');
      pupilGrad.addColorStop(1, '#000000');
      ctx.beginPath();
      ctx.arc(x, y, pupilR, 0, Math.PI * 2);
      ctx.fillStyle = pupilGrad;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, pupilR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x - pupilR * 0.35, y - pupilR * 0.4, pupilR * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fill();
    }

    function drawLauncher() {
      const { x, y } = launcher;
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.fillStyle = '#1a1a2a';
      ctx.fill();
      ctx.strokeStyle = '#aaaaaa';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }

    function drawAimLine() {
      if (!aim.active) return;
      const dx = aim.startX - aim.curX;
      const dy = aim.startY - aim.curY;
      const len = Math.hypot(dx, dy) || 1;
      const nx = dx / len;
      const ny = dy / len;
      ctx.save();
      ctx.setLineDash([4, 8]);
      ctx.strokeStyle = `rgba(255, 255, 255, ${aim.power * 0.65})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(launcher.x, launcher.y);
      let px = launcher.x, py = launcher.y;
      let pvx = nx * aim.power * 22;
      let pvy = ny * aim.power * 22;
      for (let i = 0; i < 45; i++) {
        pvy += 0.18;
        px += pvx;
        py += pvy;
        ctx.lineTo(px, py);
        if (py > canvas.height) break;
      }
      ctx.stroke();
      ctx.restore();
      ctx.beginPath();
      ctx.arc(launcher.x, launcher.y, 18 + aim.power * 26, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 255, 255, ${aim.power * 0.55})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function drawTrail() {
      projectile.trail.forEach(t => {
        const alpha = (1 - t.age / 20) * 0.55;
        const r = 5.5 * (1 - t.age / 20);
        ctx.beginPath();
        ctx.arc(t.x, t.y, Math.max(0.6, r), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fill();
      });
    }

    function drawProjectile() {
      if (!projectile.active) return;
      const grad = ctx.createRadialGradient(projectile.x, projectile.y, 0, projectile.x, projectile.y, 13);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(1, 'rgba(200, 200, 200, 0)');
      ctx.beginPath();
      ctx.arc(projectile.x, projectile.y, 13, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(projectile.x, projectile.y, 5.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }

    function drawParticles() {
      for (let p of particles) {
        ctx.globalAlpha = p.life / 110;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawFlashes() {
      if (hitFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${hitFlash / 420})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      if (missFlash > 0) {
        ctx.fillStyle = `rgba(255, 100, 100, ${missFlash / 420})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawFlashes();
      drawEye();
      drawTrail();
      drawProjectile();
      drawLauncher();
      drawAimLine();
      drawParticles();
    }

    function initGame() {
      score = 0;
      lives = 3;
      level = 1;
      combo = 0;
      projectile.active = false;
      projectile.trail = [];
      particles = [];
      hitFlash = 0;
      missFlash = 0;
      comboAnim = 0;
      gameState = 'aiming';
      launcher.x = canvas.width / 2;
      launcher.y = canvas.height - 100;
      spawnEye();
      updateUI();
      updateLives();
      document.getElementById('combo-display').style.opacity = '0';
    }

    function onPointerDown(e) {
      e.preventDefault();
      if (gameState !== 'aiming') return;
      aim.active = true;
      aim.startX = e.clientX;
      aim.startY = e.clientY;
      aim.curX = e.clientX;
      aim.curY = e.clientY;
      aim.power = 0;
    }

    function onPointerMove(e) {
      e.preventDefault();
      if (!aim.active) return;
      aim.curX = e.clientX;
      aim.curY = e.clientY;
      const dx = aim.startX - aim.curX;
      const dy = aim.startY - aim.curY;
      aim.power = Math.min(1, Math.hypot(dx, dy) / 140);
    }

    function onPointerUp(e) {
      e.preventDefault();
      if (!aim.active || gameState !== 'aiming') {
        aim.active = false;
        return;
      }
      aim.active = false;
      fire();
    }

    function onPointerCancel(e) {
      e.preventDefault();
      aim.active = false;
    }

    canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
    canvas.addEventListener('pointermove', onPointerMove, { passive: false });
    canvas.addEventListener('pointerup', onPointerUp, { passive: false });
    canvas.addEventListener('pointercancel', onPointerCancel, { passive: false });

    let animFrame;
    function gameLoop() {
      updateGame();
      draw();
      animFrame = requestAnimationFrame(gameLoop);
    }
    gameLoop();

    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    const startScreen = document.getElementById('start-screen');
    const overScreen = document.getElementById('over-screen');

    function startGame() {
      startScreen.classList.add('hidden');
      overScreen.classList.add('hidden');
      initGame();
    }

    startBtn.addEventListener('click', startGame);
    retryBtn.addEventListener('click', startGame);

    window.addEventListener('resize', () => {
      launcher.x = canvas.width / 2;
      launcher.y = canvas.height - 100;
    });
    launcher.x = canvas.width / 2;
    launcher.y = canvas.height - 100;
  })();
</script>
</body>
</html>
